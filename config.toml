# Site configuration. This file is about the website; facts about the crate live in
# content/home/mod.toml. Zola reads this file; so does CI.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews.
base_url = "https://DreamWeave-MP.github.io/dream_archive"
title = "dream_archive"
description = "Read, extract and write Bethesda BSA and BA2 archives in pure Rust, from Morrowind to Starfield, with a Luau module for scripts."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/", "https://crates.io/", "https://docs.rs/"]

[extra]
# The repository that builds and publishes this site. CI refuses to build anywhere else.
github_username = "DreamWeave-MP"
github_project = "dream_archive"

logo_text = "dream_archive"
footer_text = "dream_archive · MIT OR Apache-2.0 · DreamWeave contributors"
# The DreamWeave logo.
favicon = "img/dreamweave-logo.png"

palette = "slate"

# DejaVu Sans Mono for titles: archive paths and hashes are what this crate is about, and they
# read as monospace. The docs are read, so their text stays in the system font.
font_override = "deja-vu-sans-mono"
font_override_titles_only = true

menu_items = [
    { name = "Overview", url = "@/home/index.md" },
    { name = "Guide", url = "@/docs/_index.md" },
    { name = "Rust API", url = "@/docs/api/_index.md" },
    { name = "Luau API", url = "@/docs/luau/_index.md" },
    { name = "Command line", url = "https://DreamWeave-MP.github.io/dream_archivetool/" },
]

# DreamWeave's own page-view counter: this is DreamWeave's site.
goatcounter = "dreamweave-mp"

# The hero's art: an archive opened, drawn live with three.js (static/js/dream-archive-hero.js).
[extra.hero]
script = "js/dream-archive-hero.js"
preload = ["js/vendor/three.module.min.js", "js/vendor/three.core.min.js"]

# GitHub Discussions on this repository, through giscus. The ids are looked up at build time.
[extra.comments]
enabled = true
category = "General"
