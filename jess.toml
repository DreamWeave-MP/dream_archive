manifest_version = 1

[package]
id = "org.dreamweave.dream-archive"
version = "2.0.0"
jess_api = "1"
include = ["src", "tests"]
tests = ["tests/run.jsl", "tests/style.jsl"]

[modules]
"@dream-archive" = "src/init.jsl"
"@dream-archive/ba2" = "src/ba2.jsl"
"@dream-archive/bsa" = "src/bsa/init.jsl"
"@dream-archive/bsa/tes3" = "src/bsa/tes3.jsl"
"@dream-archive/bsa/tes4" = "src/bsa/tes4.jsl"
# Exported for dream-archivetool, whose archive policy is built from these three; they are not
# the archive API.
"@dream-archive/types" = "src/internal/types.jsl"
"@dream-archive/util" = "src/internal/util.jsl"
"@dream-archive/backend" = "src/internal/archive.jsl"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it.

[[layer]]
id = "dream-archive.core"
exports = [
    "@dream-archive",
    "@dream-archive/ba2",
    "@dream-archive/bsa",
    "@dream-archive/bsa/tes3",
    "@dream-archive/bsa/tes4",
    "@dream-archive/types",
    "@dream-archive/util",
    "@dream-archive/backend",
]
