# DreamWeave Archive as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `archive-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "b328958f-26c6-4f38-b1df-29dec9c387db"
slug = "archive"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.dream-archive"

[[releases]]
version = "0.1.0"
date = 2026-10-19
summary = "First release published as a DreamWeave project."
