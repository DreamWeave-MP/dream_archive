[package]
name = "dream_archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[dependencies]
bstr = { version = "1.12", default-features = false, features = ["std"] }
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.13", default-features = false, optional = true }
memmap2 = { version = "0.9", optional = true }
rayon = { version = "1.11", optional = true }

[dev-dependencies]
walkdir = "2.5"

[features]
default = ["ba2", "bsa"]
ba2 = ["dep:flate2", "dep:lz4_flex", "dep:memmap2"]
bsa = ["bsa-tes3", "bsa-tes4"]
bsa-tes3 = []
bsa-tes4 = ["dep:flate2", "dep:lz4_flex", "dep:memmap2", "lz4_flex/frame"]
parallel = ["dep:rayon"]

[[example]]
name = "list_ba2"
required-features = ["ba2"]

[[example]]
name = "extract_ba2"
required-features = ["ba2"]

[[test]]
name = "ba2_fixtures"
required-features = ["ba2"]

[[test]]
name = "ba2_hash"
required-features = ["ba2"]

[[test]]
name = "ba2_synthetic"
required-features = ["ba2"]

[[test]]
name = "bsa_hash"
required-features = ["bsa"]

[[test]]
name = "bsa_encoding"
required-features = ["bsa"]

[[test]]
name = "bsa_tes4_fixtures"
required-features = ["bsa-tes4"]

[[test]]
name = "bsa_tes4_synthetic"
required-features = ["bsa-tes4"]

[[test]]
name = "bsa_tes3_synthetic"
required-features = ["bsa-tes3"]

[[bench]]
name = "morrowind_extract"
harness = false
required-features = ["bsa-tes3"]
