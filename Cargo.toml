[package]
name = "dream_archive"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/DreamWeave-MP/dream-archive"
documentation = "https://dreamweave-mp.github.io/dream-archive/"
description = "Pure-Rust Bethesda BA2 and BSA archive reader, extractor, and writer"
readme = "README.md"
keywords = ["bethesda", "archive", "ba2", "bsa", "morrowind"]
categories = ["game-development", "filesystem"]

[dependencies]
dream-path = "0.2"
l3i = { version = "1.0.0", path = "../dream-binder", optional = true }
encoding_rs = { version = "0.8.42", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.14", default-features = false, optional = true }
memmap2 = { version = "0.9.11", optional = true }
rayon = { version = "1.12", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
walkdir = "2.5"

[features]
default = ["ba2", "bsa"]
ba2 = ["dep:flate2", "dep:lz4_flex", "dep:memmap2"]
bsa = ["bsa-tes3", "bsa-tes4"]
bsa-tes3 = ["dep:encoding_rs", "dep:memmap2"]
bsa-tes4 = ["dep:encoding_rs", "dep:flate2", "dep:lz4_flex", "dep:memmap2", "lz4_flex/frame"]
parallel = ["dep:rayon"]
# The l3i extension (`dream_archive::luau`); `lua` is the old name of the same feature.
luau = ["dep:l3i", "ba2", "bsa"]
lua = ["luau"]
# The definitions gate (`RuntimePlan::check_definitions`, l3i feature `analysis`) for the typed
# tests: `cargo test --features luau-analysis --test luau_api`. Cargo has no optional
# dev-dependencies, so this keeps plain `cargo test --features luau` from building Luau's
# analysis frontend.
luau-analysis = ["luau", "l3i/analysis"]

[package.metadata.docs.rs]
features = ["luau"]

