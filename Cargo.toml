[package]
name = "dream_archive"
version = "0.1.6"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"
repository = "https://github.com/DreamWeave-MP/dream-archive"
documentation = "https://dreamweave-mp.github.io/dream-archive/"
description = "Pure-Rust Bethesda BA2 and BSA archive reader, extractor, and writer"
readme = "README.md"
keywords = ["bethesda", "archive", "ba2", "bsa", "morrowind"]
categories = ["game-development", "filesystem"]

[dependencies]
dream-path = "0.1.3"
encoding_rs = { version = "0.8", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
lz4_flex = { version = "0.13", default-features = false, optional = true }
memmap2 = { version = "0.9", optional = true }
mlua = { version = "0.11.6", default-features = false, optional = true }
rayon = { version = "1.11", optional = true }

[dev-dependencies]
walkdir = "2.5"

[features]
default = ["ba2", "bsa"]
ba2 = ["dep:flate2", "dep:lz4_flex", "dep:memmap2"]
bsa = ["bsa-tes3", "bsa-tes4"]
bsa-tes3 = ["dep:encoding_rs", "dep:memmap2"]
bsa-tes4 = ["dep:encoding_rs", "dep:flate2", "dep:lz4_flex", "dep:memmap2", "lz4_flex/frame"]
parallel = ["dep:rayon"]
lua = ["dep:mlua", "dream-path/lua", "ba2", "bsa"]
standalone-lua = ["lua", "mlua/luajit52", "mlua/vendored"]

[package.metadata.docs.rs]
features = ["standalone-lua"]

[[example]]
name = "list_ba2"
required-features = ["ba2"]

[[example]]
name = "extract_ba2"
required-features = ["ba2"]

[[example]]
name = "list_archive"
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]

[[example]]
name = "extract_archive"
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]

[[example]]
name = "build_ba2"
required-features = ["ba2"]

[[example]]
name = "build_ba2_dx10"
required-features = ["ba2"]

[[example]]
name = "build_tes3_bsa"
required-features = ["bsa-tes3"]

[[example]]
name = "build_tes4_bsa"
required-features = ["bsa-tes4"]

[[test]]
name = "ba2_fixtures"
required-features = ["ba2"]

[[test]]
name = "ba2_hash"
required-features = ["ba2"]

[[test]]
name = "ba2_synthetic"
required-features = ["ba2"]

[[test]]
name = "bsa_hash"
required-features = ["bsa"]

[[test]]
name = "bsa_encoding"
required-features = ["bsa"]

[[test]]
name = "bsa_tes4_fixtures"
required-features = ["bsa-tes4"]

[[test]]
name = "bsa_tes4_synthetic"
required-features = ["bsa-tes4"]

[[test]]
name = "bsa_tes3_synthetic"
required-features = ["bsa-tes3"]

[[test]]
name = "lua_api"
required-features = ["lua"]

[[bench]]
name = "morrowind_extract"
harness = false
required-features = ["bsa-tes3"]

[[bench]]
name = "lookup"
harness = false
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]

[[bench]]
name = "synthetic_extract"
harness = false
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]

[[bench]]
name = "allocations"
harness = false
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]

[[bench]]
name = "parse"
harness = false
required-features = ["ba2", "bsa-tes3", "bsa-tes4"]
